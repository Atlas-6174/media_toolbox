services:
  calibre:
    build:
      context: .
      dockerfile: docker/calibre/Dockerfile
    image: local/toolbox-calibre:latest
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./storage:/workspace
    working_dir: /workspace
    network_mode: none
    stdin_open: false
    tty: false

  ffmpeg:
    image: jrottenberg/ffmpeg:latest
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./storage:/workspace
    working_dir: /workspace
    network_mode: none
    stdin_open: false
    tty: false

  yt-dlp:
    image: jauderho/yt-dlp:latest
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./storage:/workspace
    working_dir: /workspace

  pdf:
    image: local/toolbox-calibre:latest
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./storage:/workspace
    working_dir: /workspace
    network_mode: none
    entrypoint: ["pdfunite"]

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: local/toolbox-web:latest
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - UID=${UID:-1000}
      - GID=${GID:-1000}
    restart: unless-stopped


