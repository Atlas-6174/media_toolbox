[project]
name = "media-toolbox"
version = "0.1.0"
description = "CLI Toolbox local con micro-contenedores"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic-settings>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]


[project.scripts]
tb = "src.main:app"
toolbox = "src.main:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.core", "src.tools"]
