version: 2
updates:
  # Dependencias de Python declaradas en pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  # Imágenes base de los Dockerfiles (docker/web, docker/tools, docker/calibre,
  # docker/libreoffice, docker/rembg)
  - package-ecosystem: "docker"
    directory: "/docker/web"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/docker/tools"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/docker/calibre"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/docker/libreoffice"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/docker/rembg"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  # Imágenes referenciadas directamente en docker-compose.yml (ffmpeg, yt-dlp)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"

  # Versiones de las acciones usadas en los workflows de CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
